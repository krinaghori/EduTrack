services:
  - type: web
    name: edutrack-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://chipper-syrniki-ba897a.netlify.app
      - key: ADMIN_INITIAL_EMAIL
        value: admin@edutrack.edu
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
